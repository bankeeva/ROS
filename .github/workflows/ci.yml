      - name: Build and Test PR08 localization_case package
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-lyrical-nav2-amcl \
            ros-lyrical-nav2-map-server \
            ros-lyrical-nav2-lifecycle-manager \
            ros-lyrical-tf2-ros-py \
            ros-lyrical-tf2-tools \
            python3-yaml
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install --packages-select localization_case
          source install/setup.bash
          test -f "$(ros2 pkg prefix localization_case)/share/localization_case/launch/localization.launch.py"
          test -f "$(ros2 pkg prefix localization_case)/share/localization_case/config/amcl.yaml"
          test -f "$(ros2 pkg prefix localization_case)/share/localization_case/config/amcl-defect.yaml"
          test -x "$(ros2 pkg prefix localization_case)/lib/localization_case/localization_metrics.py"
          python3 -m py_compile src/localization_case/launch/localization.launch.py
          python3 -m py_compile src/localization_case/scripts/localization_metrics.py
          colcon test --packages-select localization_case --event-handlers console_direct+
          colcon test-result --verbose
          python3 .course-kit/v1/tools/validate_localization.py \
            evidence/pr08/localization.json \
            --schema .course-kit/v1/fixtures/pr08/localization-result-v1.schema.json \
            --map-yaml evidence/pr08/map.yaml \
            --map-pgm evidence/pr08/map.pgm

      - name: Check PR08 evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR08 --submission .
