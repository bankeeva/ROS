amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /vehicle/scan
    map_topic: /map
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.12
    laser_max_range: 20.0
    max_beams: 90
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.05
    update_min_a: 0.05
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.0
    z_max: 0.0
    do_beamskip: false
    tf_broadcast: true
    transform_tolerance: 0.2
    # Отрицательная частота отключает сохранение последней позы; 0 даёт 1/0 в Jazzy.
    save_pose_rate: -1.0
    always_reset_initial_pose: true
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    # localization.launch.py заменяет значение абсолютным путём из аргумента map.
    yaml_filename: ''

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - map_server
      - amcl
